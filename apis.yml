name: Moxxie Ventures
description: Moxxie Ventures is an early-stage (pre-seed and seed) venture capital firm founded in 2019
  by Katie Jacobs Stanton, backing exceptional, technical founders building a better future. The firm
  writes $500K-$2M checks (typically ~$1.5M for roughly 10% ownership) across enterprise software, climate,
  consumer, fintech, healthcare, infrastructure (dev platforms, robotics, autonomy) and vertical AI, and
  has raised three funds including a $95M third fund in 2024. Its 100+ portfolio companies include Airtable,
  Calm, Carta, Coinbase, Lime, Opendoor and Tipalti. Moxxie publishes no public API or developer surface.
